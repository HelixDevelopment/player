 Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#F3F7F6" text-anchor="start" >Enter a valid duration</text><text x="920" y="681" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#FF9B9B" text-anchor="start" >Message identifies the correction.</text><text x="40" y="740" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">BADGES / STATUS</text><rect x="40" y="765" width="220" height="32" rx="16.0" fill="#254239" /><text x="150.0" y="785.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#79E3C2" text-anchor="middle" >FLAC · 24/96</text><rect x="290" y="765" width="220" height="32" rx="16.0" fill="#44382A" /><text x="400.0" y="785.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#F3C580" text-anchor="middle" >Buffering</text><rect x="540" y="765" width="220" height="32" rx="16.0" fill="#243139" /><text x="650.0" y="785.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#ADBDC5" text-anchor="middle" >Offline</text><rect x="790" y="765" width="220" height="32" rx="16.0" fill="#243139" /><text x="900.0" y="785.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#ADBDC5" text-anchor="middle" >Explicit</text><rect x="1040" y="765" width="220" height="32" rx="16.0" fill="#254239" /><text x="1150.0" y="785.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#79E3C2" text-anchor="middle" >Queued · 2</text><rect x="40" y="844" width="1320" height="112" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="64" y="878" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#F3F7F6" text-anchor="start" >Component rules</text><text x="64" y="901" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Minimum pointer target 24 px; design default 40 px desktop / 44 px touch. Focus ring is never removed.</text><text x="64" y="929" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Labels remain visible for unfamiliar actions. Color is reinforced by text, icon, shape or position.</text></svg>