"494" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Presets</text><rect x="598" y="527" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="705" y="556" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Capabilities</text><rect x="598" y="589" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="705" y="618" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Timer outcomes</text><path d="M700 264 V298 H979 V326" fill="none" stroke="#35454E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="862" y="326" width="234" height="74" rx="10" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="979.0" y="355" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="15" font-weight="650" fill="#F3F7F6" text-anchor="middle" >PERSONALIZE</text><text x="979.0" y="378" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#ADBDC5" text-anchor="middle" >Skins / Shortcuts</text><text x="979" y="426" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="middle" >Accessibility</text><rect x="872" y="465" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="979" y="494" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Token editor</text><rect x="872" y="527" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="979" y="556" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Skin import</text><rect x="872" y="589" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="979" y="618" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Focus / motion</text><path d="M700 264 V298 H1253 V326" fill="none" stroke="#35454E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1136" y="326" width="234" height="74" rx="10" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="1253.0" y="355" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="15" font-weight="650" fill="#F3F7F6" text-anchor="middle" >MANAGE</text><text x="1253.0" y="378" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#ADBDC5" text-anchor="middle" >Import / Tags</text><text x="1253" y="426" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="middle" >Privacy / Recovery</text><rect x="1146" y="465" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="1253" y="494" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Source folders</text><rect x="1146" y="527" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="1253" y="556" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Batch operations</text><rect x="1146" y="589" width="214" height="46" rx="8" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="1253" y="618" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#F3F7F6" text-anchor="middle" >Diagnostics</text><rect x="40" y="692" width="1320" height="184" rx="14" fill="#FFFFFF" stroke="#A8B8B2" stroke-width="1" /><text x="64" y="726" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#233B33" text-anchor="start" >Cross-cutting rules</text><text x="66" y="773" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Queue, playlist context, selection and history are different data structures.</text><text x="66" y="798" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Search and shortcuts work from every primary view; Esc closes the top layer only.</text><text x="66" y="823" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Unsupported capabilities are hidden or explained, never shown as functional toggles.</text><text x="66" y="848" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Skin changes preserve labels, focus order, target sizes and state semantics.</text></svg>