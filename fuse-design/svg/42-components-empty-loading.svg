<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="42-components-empty-loading-title 42-components-empty-loading-desc"><title id="42-components-empty-loading-title">Component sheet — empty, loading and offline</title><desc id="42-components-empty-loading-desc">Non-ideal states with one clear next action and honest preservation semantics.</desc><defs>
 <linearGradient id="art-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163D42"/><stop offset=".52" stop-color="#327775"/><stop offset="1" stop-color="#102B38"/></linearGradient>
 <linearGradient id="art-sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE2A3"/><stop offset=".55" stop-color="#F3B786"/><stop offset="1" stop-color="#DC897D"/></linearGradient>
 <linearGradient id="wave-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79E3C2" stop-opacity=".38"/><stop offset="1" stop-color="#79E3C2" stop-opacity=".02"/></linearGradient>
 <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79E3C2"/><stop offset=".6" stop-color="#91BFFF"/><stop offset="1" stop-color="#F3C580"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#4D9C8C" stop-opacity=".24"/><stop offset="1" stop-color="#4D9C8C" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#53616A"/><stop offset=".48" stop-color="#303D47"/><stop offset=".52" stop-color="#26323B"/><stop offset="1" stop-color="#414F58"/></linearGradient>
 <linearGradient id="classic-wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75E6BB"/><stop offset=".5" stop-color="#E6E997"/><stop offset="1" stop-color="#F3B47B"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8CA8A0" opacity=".22"/></pattern>
 </defs><rect x="0" y="0" width="1400" height="940" rx="0" fill="#101519" /><rect x="0" y="0" width="1400" height="940" rx="0" fill="url(#dots)" /><g transform="translate(40 30) scale(0.8125)"><rect x="0" y="10.0" width="3.5" height="12" rx="1.7" fill="#79E3C2" /><rect x="6" y="4.5" width="3.5" height="23" rx="1.7" fill="#79E3C2" /><rect x="12" y="0.0" width="3.5" height="32" rx="1.7" fill="#79E3C2" /><rect x="18" y="6.0" width="3.5" height="20" rx="1.7" fill="#79E3C2" /><rect x="24" y="11.0" width="3.5" height="10" rx="1.7" fill="#79E3C2" /></g><text x="78" y="48.980000000000004" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="18.98" font-weight="750" fill="#F3F7F6" text-anchor="start" letter-spacing="2">FUSE</text><text x="180" y="50" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM / 1.0</text><text x="40" y="112" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="32" font-weight="650" fill="#F3F7F6" text-anchor="start" >05 / Empty, loading and unavailable</text><text x="40" y="143" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#ADBDC5" text-anchor="start" >Every non-ideal state explains what happened, what remains usable and what to do next.</text><rect x="40" y="205" width="420" height="380" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="64" y="239" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#F3F7F6" text-anchor="start" >No albums yet</text><text x="64" y="262" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Choose a folder to start your local library.</text><circle cx="250" cy="355" r="52" fill="#243139" /><g transform="translate(228 333) scale(1.8333333333333333)"><path d="M3 7 V5 H10 L12 8 H21 V19 H3 Z" fill="none" stroke="#79E3C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="250" y="445" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="middle" >Nothing is uploaded.</text><rect x="80" y="505" width="340" height="44" rx="9" fill="#79E3C2" /><g transform="translate(94 518.0) scale(0.75)"><path d="M3 7 V5 H10 L12 8 H21 V19 H3 Z" fill="none" stroke="#10251F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="122" y="532.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#10251F" text-anchor="start" >Choose folder</text><rect x="490" y="205" width="420" height="380" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="514" y="239" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#F3F7F6" text-anchor="start" >Searching your library</text><text x="514" y="262" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >1,204 of 2,418 tracks checked. Existing results stay usable.</text><circle cx="700" cy="355" r="52" fill="#243139" /><g transform="translate(678 333) scale(1.8333333333333333)"><path d="M10 3 A7 7 0 1 0 10 17 A7 7 0 1 0 10 3 M15 15 L21 21" fill="none" stroke="#79E3C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="700" y="445" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="middle" >No playback interruption.</text><rect x="530" y="505" width="340" height="44" rx="9" fill="#243139" stroke="#35454E" stroke-width="1" /><g transform="translate(544 518.0) scale(0.75)"><path d="M10 3 A7 7 0 1 0 10 17 A7 7 0 1 0 10 3 M15 15 L21 21" fill="none" stroke="#F3F7F6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="572" y="532.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Cancel search</text><rect x="940" y="205" width="420" height="380" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="964" y="239" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#F3F7F6" text-anchor="start" >This drive is offline</text><text x="964" y="262" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Reconnect it or keep playing available local tracks.</text><circle cx="1150" cy="355" r="52" fill="#243139" /><g transform="translate(1128 333) scale(1.8333333333333333)"><path d="M5 7 H18 L21 10 M19 3 L22 7 L19 11 M19 17 H6 L3 14 M5 13 L2 17 L5 21" fill="none" stroke="#F3C580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1150" y="445" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="middle" >Your queue is preserved.</text><rect x="980" y="505" width="340" height="44" rx="9" fill="#243139" stroke="#35454E" stroke-width="1" /><g transform="translate(994 518.0) scale(0.75)"><path d="M5 7 H18 L21 10 M19 3 L22 7 L19 11 M19 17 H6 L3 14 M5 13 L2 17 L5 21" fill="none" stroke="#F3F7F6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1022" y="532.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Retry connection</text><rect x="40" y="625" width="1320" height="230" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="64" y="659" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#F3F7F6" text-anchor="start" >State-specific rules</text><text x="66" y="704" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Empty: one primary action; no fake content or misleading counts.</text><text x="66" y="733" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Loading: preserve stale results with a timestamp; show progress only when measurable.</text><text x="66" y="762" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Offline: distinguish unavailable remote content from available local files.</text><text x="66" y="791" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Error: keep the recovery message persistent; a toast alone is insufficient.</text><text x="66" y="820" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Canceled: retain completed work; explain exactly what was kept.</text></svg>