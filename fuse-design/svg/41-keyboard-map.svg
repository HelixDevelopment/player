<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="41-keyboard-map-title 41-keyboard-map-desc"><title id="41-keyboard-map-title">Keyboard shortcut map</title><desc id="41-keyboard-map-desc">Scoped playback, search, queue and overlay shortcuts with conflict and text-entry rules.</desc><defs>
 <linearGradient id="art-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163D42"/><stop offset=".52" stop-color="#327775"/><stop offset="1" stop-color="#102B38"/></linearGradient>
 <linearGradient id="art-sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE2A3"/><stop offset=".55" stop-color="#F3B786"/><stop offset="1" stop-color="#DC897D"/></linearGradient>
 <linearGradient id="wave-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79E3C2" stop-opacity=".38"/><stop offset="1" stop-color="#79E3C2" stop-opacity=".02"/></linearGradient>
 <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79E3C2"/><stop offset=".6" stop-color="#91BFFF"/><stop offset="1" stop-color="#F3C580"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#4D9C8C" stop-opacity=".24"/><stop offset="1" stop-color="#4D9C8C" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#53616A"/><stop offset=".48" stop-color="#303D47"/><stop offset=".52" stop-color="#26323B"/><stop offset="1" stop-color="#414F58"/></linearGradient>
 <linearGradient id="classic-wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75E6BB"/><stop offset=".5" stop-color="#E6E997"/><stop offset="1" stop-color="#F3B47B"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8CA8A0" opacity=".22"/></pattern>
 </defs><rect x="0" y="0" width="1400" height="940" rx="0" fill="#F0F3F2" /><rect x="0" y="0" width="1400" height="940" rx="0" fill="url(#dots)" /><g transform="translate(40 30) scale(0.8125)"><rect x="0" y="10.0" width="3.5" height="12" rx="1.7" fill="#245C49" /><rect x="6" y="4.5" width="3.5" height="23" rx="1.7" fill="#245C49" /><rect x="12" y="0.0" width="3.5" height="32" rx="1.7" fill="#245C49" /><rect x="18" y="6.0" width="3.5" height="20" rx="1.7" fill="#245C49" /><rect x="24" y="11.0" width="3.5" height="10" rx="1.7" fill="#245C49" /></g><text x="78" y="48.980000000000004" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="18.98" font-weight="750" fill="#233B33" text-anchor="start" letter-spacing="2">FUSE</text><text x="180" y="50" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#63796F" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM / 1.0</text><text x="40" y="112" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="32" font-weight="650" fill="#233B33" text-anchor="start" >Keyboard map / predictable shortcuts</text><text x="40" y="143" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#526A61" text-anchor="start" >Shortcuts are scoped. Text fields keep normal editing keys; global OS shortcuts require separate permission.</text><rect x="40" y="202" width="1320" height="48" rx="6" fill="#1B242B" /><rect x="54" y="210" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="230.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Space</text><text x="292" y="232" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Play / pause</text><text x="650" y="232" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Not while typing or activating a focused button</text><rect x="40" y="255" width="1320" height="48" rx="6" fill="#151C21" /><rect x="54" y="263" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="283.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >← / →</text><text x="292" y="285" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Seek ±5 s</text><text x="650" y="285" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Disabled for live streams</text><rect x="40" y="308" width="1320" height="48" rx="6" fill="#1B242B" /><rect x="54" y="316" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="336.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Shift + ← / →</text><text x="292" y="338" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Seek ±30 s</text><text x="650" y="338" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Clamp to track boundaries</text><rect x="40" y="361" width="1320" height="48" rx="6" fill="#151C21" /><rect x="54" y="369" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="389.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >↑ / ↓</text><text x="292" y="391" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Volume ±1%</text><text x="650" y="391" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >When transport region is focused</text><rect x="40" y="414" width="1320" height="48" rx="6" fill="#1B242B" /><rect x="54" y="422" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="442.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >M</text><text x="292" y="444" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Mute / unmute</text><text x="650" y="444" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Not while typing</text><rect x="40" y="467" width="1320" height="48" rx="6" fill="#151C21" /><rect x="54" y="475" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="495.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Q</text><text x="292" y="497" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Add selection to queue</text><text x="650" y="497" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Announce count and undo</text><rect x="40" y="520" width="1320" height="48" rx="6" fill="#1B242B" /><rect x="54" y="528" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="548.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Alt + ↑ / ↓</text><text x="292" y="550" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Reorder queue item</text><text x="650" y="550" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Only when a queue item is focused</text><rect x="40" y="573" width="1320" height="48" rx="6" fill="#151C21" /><rect x="54" y="581" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="601.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Ctrl / ⌘ + F</text><text x="292" y="603" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Search library</text><text x="650" y="603" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Focus search field</text><rect x="40" y="626" width="1320" height="48" rx="6" fill="#1B242B" /><rect x="54" y="634" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="654.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Ctrl / ⌘ + ,</text><text x="292" y="656" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Open settings</text><text x="650" y="656" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Preserve return focus</text><rect x="40" y="679" width="1320" height="48" rx="6" fill="#151C21" /><rect x="54" y="687" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="707.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >Esc</text><text x="292" y="709" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Close top layer</text><text x="650" y="709" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Then leave focus view; never quit app</text><rect x="40" y="732" width="1320" height="48" rx="6" fill="#1B242B" /><rect x="54" y="740" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="760.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >F11 / host equivalent</text><text x="292" y="762" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Focus view</text><text x="650" y="762" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Host decides actual fullscreen shortcut</text><rect x="40" y="785" width="1320" height="48" rx="6" fill="#151C21" /><rect x="54" y="793" width="210" height="32" rx="16.0" fill="#E8EEEC" /><text x="159.0" y="813.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#526A61" text-anchor="middle" >?</text><text x="292" y="815" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Open shortcut reference</text><text x="650" y="815" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Not while typing</text><text x="40" y="881" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >All bindings are remappable. Conflict detection happens before save; “Restore defaults” is always available.</text></svg>