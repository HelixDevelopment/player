="start" >State tint</text><text x="250" y="660" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Hover or selected fill; never obscures text</text><text x="66" y="703" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="650" fill="#F3F7F6" text-anchor="start" >Content</text><text x="250" y="703" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Icon + label + value; stable geometry</text><text x="66" y="746" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="650" fill="#F3F7F6" text-anchor="start" >Focus</text><text x="250" y="746" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >2 px ring + 2 px offset; visible above tint</text><text x="66" y="789" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="650" fill="#F3F7F6" text-anchor="start" >Drag / error</text><text x="250" y="789" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >Insertion line or inline message; not color alone</text></svg>