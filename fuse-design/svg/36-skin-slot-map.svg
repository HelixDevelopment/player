 </defs><rect x="0" y="0" width="1400" height="960" rx="0" fill="#F0F3F2" /><rect x="0" y="0" width="1400" height="960" rx="0" fill="url(#dots)" /><g transform="translate(40 30) scale(0.8125)"><rect x="0" y="10.0" width="3.5" height="12" rx="1.7" fill="#245C49" /><rect x="6" y="4.5" width="3.5" height="23" rx="1.7" fill="#245C49" /><rect x="12" y="0.0" width="3.5" height="32" rx="1.7" fill="#245C49" /><rect x="18" y="6.0" width="3.5" height="20" rx="1.7" fill="#245C49" /><rect x="24" y="11.0" width="3.5" height="10" rx="1.7" fill="#245C49" /></g><text x="78" y="48.980000000000004" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="18.98" font-weight="750" fill="#233B33" text-anchor="start" letter-spacing="2">FUSE</text><text x="180" y="50" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#63796F" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM / 1.0</text><text x="40" y="112" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="32" font-weight="650" fill="#233B33" text-anchor="start" >Skin contract / anatomy</text><text x="40" y="143" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#526A61" text-anchor="start" >Skins may change tokens, artwork and permitted layout variants. They may not change meanings or run code.</text><rect x="40" y="195" width="1320" height="600" rx="14" fill="#151C21" stroke="#35454E" stroke-width="1" /><rect x="60" y="215" width="1280" height="54" rx="8" fill="#243139" stroke="#79E3C2" stroke-width="2" /><text x="700.0" y="247.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#F3F7F6" text-anchor="middle" >APP CHROME</text><rect x="60" y="285" width="200" height="420" rx="8" fill="#243139" stroke="#79E3C2" stroke-width="2" /><text x="160.0" y="500.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size=