<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="36-skin-slot-map-title 36-skin-slot-map-desc"><title id="36-skin-slot-map-title">Skin slot architecture</title><desc id="36-skin-slot-map-desc">Tokenized chrome, navigation, content, queue and transport slots with locked behavioral and accessibility invariants.</desc><defs>
