<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="31-components-overlays-title 31-components-overlays-desc"><title id="31-components-overlays-title">Component sheet — menus, alerts, toasts and dialogs</title><desc id="31-components-overlays-desc">Overlay hierarchy, destructive confirmation, undo and persistent error guidance.</desc><defs>
 <linearGradient id="art-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163D42"/><stop offset=".52" stop-color="#327775"/><stop offset="1" stop-color="#102B38"/></linearGradient>
 <linearGradient id="art-sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE2A3"/><stop offset=".55" stop-color="#F3B786"/><stop offset="1" stop-color="#DC897D"/></linearGradient>
 <linearGradient id="wave-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79E3C2" stop-opacity=".38"/><stop offset="1" stop-color="#79E3C2" stop-opacity=".02"/></linearGradient>
 <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79E3C2"/><stop offset=".6" stop-color="#91BFFF"/><stop offset="1" stop-color="#F3C580"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#4D9C8C" stop-opacity=".24"/><stop offset="1" stop-color="#4D9C8C" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#53616A"/><stop offset=".48" stop-color="#303D47"/><stop offset=".52" stop-color="#26323B"/><stop offset="1" stop-color="#414F58"/></linearGradient>
 <linearGradient id="classic-wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75E6BB"/><stop offset=".5" stop-color="#E6E997"/><stop offset="1" stop-color="#F3B47B"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8CA8A0" opacity=".22"/></pattern>
 </defs><rect x="0" y="0" width="1400" height="1040" rx="0" fill="#101519" /><rect x="0" y="0" width="1400" height="1040" rx="0" fill="url(#dots)" /><g transform="translate(40 30) scale(0.8125)"><rect x="0" y="10.0" width="3.5" height="12" rx="1.7" fill="#79E3C2" /><rect x="6" y="4.5" width="3.5" height="23" rx="1.7" fill="#79E3C2" /><rect x="12" y="0.0" width="3.5" height="32" rx="1.7" fill="#79E3C2" /><rect x="18" y="6.0" width="3.5" height="20" rx="1.7" fill="#79E3C2" /><rect x="24" y="11.0" width="3.5" height="10" rx="1.7" fill="#79E3C2" /></g><text x="78" y="48.980000000000004" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="18.98" font-weight="750" fill="#F3F7F6" text-anchor="start" letter-spacing="2">FUSE</text><text x="180" y="50" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM / 1.0</text><text x="40" y="112" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="32" font-weight="650" fill="#F3F7F6" text-anchor="start" >04 / Overlays and feedback</text><text x="40" y="143" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#ADBDC5" text-anchor="start" >One top layer at a time. Focus is trapped in modal dialogs; non-modal menus close predictably.</text><text x="40" y="200" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">CONTEXT MENU</text><rect x="40" y="225" width="340" height="330" rx="12" fill="#1B242B" stroke="#35454E" stroke-width="1" /><rect x="50" y="237" width="320" height="48" rx="7" fill="#243139" /><g transform="translate(64 251) scale(0.8333333333333334)"><path d="M4 6 H15 M4 12 H12 M4 18 H10 M17 12 V21 L22 17 Z" fill="none" stroke="#ADBDC5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="98" y="267" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#F3F7F6" text-anchor="start" >Play next</text><text x="350" y="267" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#84969F" text-anchor="end" >Q</text><rect x="50" y="291" width="320" height="48" rx="7" fill="none" /><g transform="translate(64 305) scale(0.8333333333333334)"><path d="M12 5 V19 M5 12 H19" fill="none" stroke="#ADBDC5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="98" y="321" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#F3F7F6" text-anchor="start" >Add to playlist</text><text x="350" y="321" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#84969F" text-anchor="end" >P</text><rect x="50" y="345" width="320" height="48" rx="7" fill="none" /><g transform="translate(64 359) scale(0.8333333333333334)"><path d="M4 4 H10 V10 H4 Z M14 4 H20 V10 H14 Z M4 14 H10 V20 H4 Z M14 14 H20 V20 H14 Z" fill="none" stroke="#ADBDC5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="98" y="375" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#F3F7F6" text-anchor="start" >Show album</text><text x="350" y="375" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#84969F" text-anchor="end" ></text><rect x="50" y="399" width="320" height="48" rx="7" fill="none" /><g transform="translate(64 413) scale(0.8333333333333334)"><path d="M4 16 L16 4 L20 8 L8 20 H4 Z M13 7 L17 11" fill="none" stroke="#ADBDC5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="98" y="429" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#F3F7F6" text-anchor="start" >Edit metadata</text><text x="350" y="429" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#84969F" text-anchor="end" >E</text><rect x="50" y="453" width="320" height="48" rx="7" fill="none" /><g transform="translate(64 467) scale(0.8333333333333334)"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="#ADBDC5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="98" y="483" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#F3F7F6" text-anchor="start" >Remove from playlist</text><text x="350" y="483" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#84969F" text-anchor="end" ></text><text x="430" y="200" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">INLINE ALERT / NON-DESTRUCTIVE</text><rect x="430" y="225" width="930" height="94" rx="10" fill="#1B242B" stroke="#35454E" stroke-width="1" /><g transform="translate(450 249) scale(1.0)"><path d="M12 3 A9 9 0 1 0 12 21 A9 9 0 1 0 12 3 M12 11 V17 M12 7 V7.1" fill="none" stroke="#79E3C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="492" y="253" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#F3F7F6" text-anchor="start" >3 tracks added to “Play next”</text><text x="492" y="280" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >They will play before the current playlist resumes.</text><rect x="1190" y="246" width="146" height="38" rx="9" fill="#243139" stroke="#35454E" stroke-width="1" /><g transform="translate(1204 256.0) scale(0.75)"><path d="M5 7 H18 L21 10 M19 3 L22 7 L19 11 M19 17 H6 L3 14 M5 13 L2 17 L5 21" fill="none" stroke="#F3F7F6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1232" y="270.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Undo</text><rect x="430" y="338" width="930" height="94" rx="10" fill="#1B242B" stroke="#FF9B9B" stroke-width="1" /><g transform="translate(450 362) scale(1.0)"><path d="M12 3 L22 21 H2 Z M12 9 V14 M12 17 V17.1" fill="none" stroke="#FF9B9B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="492" y="366" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#F3F7F6" text-anchor="start" >Could not save tags to 2 files</text><text x="492" y="393" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Your edits are still here. Review permissions and try again.</text><rect x="1190" y="359" width="146" height="38" rx="9" fill="#243139" stroke="#35454E" stroke-width="1" /><g transform="translate(1204 369.0) scale(0.75)"><path d="M9 5 L16 12 L9 19" fill="none" stroke="#F3F7F6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1232" y="383.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="start" >Review</text><text x="430" y="480" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">TOAST / SHORT, DISMISSIBLE, NEVER THE ONLY ERROR RECORD</text><rect x="430" y="505" width="930" height="58" rx="10" fill="#243139" stroke="#35454E" stroke-width="1" /><g transform="translate(450 523) scale(0.9166666666666666)"><path d="M5 12 L10 17 L20 6" fill="none" stroke="#79E3C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="488" y="540" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#F3F7F6" text-anchor="start" >Skin applied: Studio Dark</text><rect x="1190" y="515" width="146" height="38" rx="9" fill="none" /><g transform="translate(1204 525.0) scale(0.75)"><path d="M5 7 H18 L21 10 M19 3 L22 7 L19 11 M19 17 H6 L3 14 M5 13 L2 17 L5 21" fill="none" stroke="#ADBDC5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1232" y="539.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#ADBDC5" text-anchor="start" >Undo skin</text><text x="40" y="610" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#84969F" text-anchor="start" letter-spacing="1.6">MODAL / DESTRUCTIVE ACTION</text><rect x="40" y="635" width="650" height="330" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="66" y="678" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#F3F7F6" text-anchor="start" >Remove 4 tracks from this playlist?</text><text x="66" y="715" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >The audio files stay in your library and on disk.</text><text x="66" y="742" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >This changes the playlist, not the explicit queue.</text><rect x="66" y="874" width="280" height="44" rx="9" fill="#243139" stroke="#35454E" stroke-width="1" /><text x="206.0" y="901.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#F3F7F6" text-anchor="middle" >Keep tracks</text><rect x="362" y="874" width="300" height="44" rx="9" fill="#FF9B9B" /><text x="512.0" y="901.0" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#241316" text-anchor="middle" >Remove from playlist</text><rect x="730" y="635" width="630" height="330" rx="14" fill="#1B242B" stroke="#35454E" stroke-width="1" /><text x="754" y="669" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#F3F7F6" text-anchor="start" >Feedback timing</text><text x="754" y="711" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Success toast: 4 s; hover/focus pauses dismissal.</text><text x="754" y="748" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Undo queue removal: 8 s; persistent alternative in History.</text><text x="754" y="785" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Errors: remain until resolved or explicitly dismissed.</text><text x="754" y="822" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Progress: labeled, cancellable when cancellation is supported.</text><text x="754" y="859" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Screen reader: announce completion once, not every frame.</text><text x="754" y="896" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Reduced motion: no slide, bounce or pulsing notification.</text></svg>