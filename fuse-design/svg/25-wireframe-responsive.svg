 + CONTROLS</text><rect x="1110" y="710" width="240" height="44" rx="6" fill="#79E3C2" /><text x="1230.0" y="738" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#10251F" text-anchor="middle" >PERSISTENT TRANSPORT</text><text x="40" y="824" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#ADBDC5" text-anchor="start" >At 200% text size: allow vertical scrolling; never clip actions or require horizontal scrolling for core playback.</text></svg>