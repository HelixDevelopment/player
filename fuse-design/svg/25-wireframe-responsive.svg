<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="25-wireframe-responsive-title 25-wireframe-responsive-desc"><title id="25-wireframe-responsive-title">Responsive structural wireframes</title><desc id="25-wireframe-responsive-desc">Desktop, medium and compact region behavior with persistent transport and content-driven reflow.</desc><defs>
 <linearGradient id="art-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163D42"/><stop offset=".52" stop-color="#327775"/><stop offset="1" stop-color="#102B38"/></linearGradient>
 <linearGradient id="art-sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE2A3"/><stop offset=".55" stop-color="#F3B786"/><stop offset="1" stop-color="#DC897D"/></linearGradient>
 <linearGradient id="wave-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79E3C2" stop-opacity=".38"/><stop offset="1" stop-color="#79E3C2" stop-opacity=".02"/></linearGradient>
 <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79E3C2"/><stop offset=".6" stop-color="#91BFFF"/><stop offset="1" stop-color="#F3C580"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#4D9C8C" stop-opacity=".24"/><stop offset="1" stop-color="#4D9C8C" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#53616A"/><stop offset=".48" stop-color="#303D47"/><stop offset=".52" stop-color="#26323B"/><stop offset="1" stop-color="#414F58"/></linearGradient>
 <linearGradient id="classic-wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75E6BB"/><stop offset=".5" stop-color="#E6E997"/><stop offset="1" stop-color="#F3B47B"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8CA8A0" opacity=".22"/></pattern>
 </defs><rect x="0" y="0" width="1400" height="900" rx="0" fill="#F0F3F2" /><rect x="0" y="0" width="1400" height="900" rx="0" fill="url(#dots)" /><g transform="translate(40 30) scale(0.8125)"><rect x="0" y="10.0" width="3.5" height="12" rx="1.7" fill="#245C49" /><rect x="6" y="4.5" width="3.5" height="23" rx="1.7" fill="#245C49" /><rect x="12" y="0.0" width="3.5" height="32" rx="1.7" fill="#245C49" /><rect x="18" y="6.0" width="3.5" height="20" rx="1.7" fill="#245C49" /><rect x="24" y="11.0" width="3.5" height="10" rx="1.7" fill="#245C49" /></g><text x="78" y="48.980000000000004" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="18.98" font-weight="750" fill="#233B33" text-anchor="start" letter-spacing="2">FUSE</text><text x="180" y="50" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#63796F" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM / 1.0</text><text x="40" y="112" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="32" font-weight="650" fill="#233B33" text-anchor="start" >Responsive behavior</text><text x="40" y="143" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#526A61" text-anchor="start" >Breakpoints are content-driven; these are reference layouts, not device-specific assumptions.</text><text x="40" y="205" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="11" font-weight="650" fill="#63796F" text-anchor="start" letter-spacing="1.6">DESKTOP / ≥1200</text><text x="40" y="231" font-family="Inter,'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#ADBDC5" text-anchor="start" >Sidebar + content + queue</text><rect x="40" y="255" width="650" height="510" rx="12" fill="#151C21" stroke="#35454E" stroke-width="1" /><rect x="50" y="265" width="630" height="38" rx="6" fill="#243139" /><text x="62" y="290" font-family="Inter,'SF Pro Dis